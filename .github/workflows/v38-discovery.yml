name: MYM V38 Discovery
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas requests lxml
      - run: |
          echo 'V38 private research paused: public repository cannot securely store watchlists.'
          exit 1
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist.json
          if ! git diff --cached --quiet; then
            git commit -m "Update V38 watchlist"
            git pull --rebase
            git push
          fi
