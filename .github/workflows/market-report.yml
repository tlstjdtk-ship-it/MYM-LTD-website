
name: MYM Daily Market Report

on:
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: mym-market-report
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
      - name: Download website files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate market report
        run: python scripts/update_report.py

      - name: Save updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html report.json
          if ! git diff --cached --quiet; then
            git commit -m "Update MYM daily market report"
            git push
          fi
